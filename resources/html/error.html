<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORGANISM — {{status}}</title>
    <link rel="stylesheet" href="/css/organism-community.css?v=20260916-community">
  </head>
  <body>
    <main class="organism-error-page">
      <section class="organism-error-card" aria-labelledby="error-title">
        <a class="organism-error-wordmark" href="/organism">O&nbsp; / &nbsp;ORGANISM</a>
        <p class="organism-error-code">ERROR {{status}}</p>
        <h1 id="error-title">{{title}}</h1>
        <p>The page may have moved, the link may no longer be active, or the game was interrupted.</p>
        {% if message %}<p class="organism-error-detail">{{message}}</p>{% endif %}
        <nav class="organism-error-actions" aria-label="Recovery options">
          <a class="organism-error-primary" href="/organism">Return home</a>
          <a href="/organism/observe">Watch a game</a>
          <a href="/organism/learn">Learn to play</a>
        </nav>
      </section>
    </main>
  </body>
</html>
