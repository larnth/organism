<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ORGANISM — {{player}} settings</title>
    <link rel="stylesheet" href="/css/organism-community.css?v=20260916-community">
  </head>
  <body>
    <main class="organism-community-page organism-account-page">
      <header class="organism-community-header">
        <h1>{{player}}</h1>
        <p class="organism-profile-label">Player settings</p>
        <nav class="organism-account-nav" aria-label="Player navigation">
          <a href="/organism/player/{{encoded-player}}">My games</a>
          <a href="/organism">Home</a>
        </nav>
      </header>
      <section class="organism-settings-card" aria-labelledby="color-title">
        <div class="organism-settings-copy">
          <p class="organism-settings-eyebrow">Player identity</p>
          <h2 id="color-title">Your color</h2>
          <p>This color marks your seat, pieces, and turn throughout ORGANISM.</p>
          <div class="organism-color-token">
            <span id="color-preview" aria-hidden="true"></span>
            <code id="color-value"></code>
          </div>
          <p id="save-status" class="organism-save-status" role="status" aria-live="polite">Changes save automatically.</p>
        </div>
        <div class="organism-color-controls">
          <canvas id="hsl-canvas" width="220" height="220" aria-label="Choose hue and saturation"></canvas>
          <label for="lightness-slider">Brightness</label>
          <input type="range" id="lightness-slider" min="1" max="99" value="50"/>
        </div>
      </section>
    </main>
    <script>
      var csrfToken = {{csrf-token|js}};
      var playerKey = {{player|js}};
      var initialColor = {{color|js}};
    </script>
    <script src="/js/account.js?v=20260916-settings"></script>
  </body>
</html>
